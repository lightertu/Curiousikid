[project]
name = "control-server"
version = "0.1.0"
description = "control-server"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "boto3>=1.34.70",
    "dynaconf>=3.2.6",
    "websockets>=13.1",
    "aiohttp>=3.10.10",
    "ffmpeg-python>=0.2.0",
    "aiostream>=0.6.3",
    "s3fs>=2024.9.0",
    "aioboto3>=13.1.1",
    "pyyaml>=6.0.2",
    "jsonpath-ng>=1.5.3",
    "pydantic>=2.10.2",
    "pipecat>=0.3.0",
    "fastapi>=0.115.12",
    "uvicorn>=0.34.0",
    "ruff>=0.11.2",
]

[tool.pytest.ini_options]
python_classes = ["Test", "Describe"]
python_functions = ["test_", "it_", "and_", "but_", "they_"]
python_files = ["test_*.py",]
testpaths = ["tests",]

[tool.uv]
package = true
