- id: "2"
  title: "Who decides what robots look like?"
  description: "Who decides what robots look like? How do robots work and move? How are they controlled? And are robots alive? We tackle all your robot questions in this episode, and we’re taking a field trip to a local factory that uses hundreds of robots to help humans do their jobs. GlobalFoundries, in Essex Junction, Vermont makes microchips that go in all kinds of electronics. In fact, if your adults have a smartphone, more than likely it has a chip made at this very facility. Engineers Adrien Plouffe and Lucy White work with the robots at GlobalFoundries and answer your questions about robots, including: Why are robots made of metal? Why do people like robots? Do robots cry?"
