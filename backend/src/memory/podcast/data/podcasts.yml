  name: "Buy Why: A Podcast for Curious Kids"
  desc: "But Why is a show led by kids. They ask the questions and we find the answers. It’s a big interesting world out there. On But Why, we tackle topics large and small, about nature, words, even the end of the world. Know a kid with a question? Record it with a smartphone. Be sure to include your kid's first name, age, and town and send the recording to questions@butwhykids.org!"
